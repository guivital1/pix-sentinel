AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cost-controlled event-driven pipeline for synthetic PIX transactions.

Parameters:
  EnableSimulation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Explicit kill switch for scheduled event generation.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email for a USD 5 monthly AWS Budget alert.

Conditions:
  SimulationEnabled: !Equals [!Ref EnableSimulation, "true"]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: pix-sentinel

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSimulationData
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: project
          Value: pix-sentinel

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      Tags:
        - Key: project
          Value: pix-sentinel

  TransactionQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: pix-sentinel

  ProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: pix_sentinel.aws_handlers.producer_handler
      Environment:
        Variables:
          QUEUE_URL: !Ref TransactionQueue
          BATCH_SIZE: "25"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt TransactionQueue.Arn
      Events:
        DemoSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
            State: !If [SimulationEnabled, ENABLED, DISABLED]
            OmitName: true
            Description: Controlled synthetic PIX event generator

  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: pix_sentinel.aws_handlers.consumer_handler
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt TransactionQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ConsumerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PIX Sentinel consumer errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ConsumerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest PIX event has waited more than five minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TransactionQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least one PIX event requires DLQ investigation
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: pix-sentinel-operations
      DashboardBody: !Sub |
        {"widgets":[{"type":"metric","width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Queue health","metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${TransactionQueue.QueueName}"],[".","ApproximateAgeOfOldestMessage",".","."]] }},{"type":"metric","width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Consumer reliability","metrics":[["AWS/Lambda","Errors","FunctionName","${ConsumerFunction}"],[".","Duration",".","."]]}}]}

  ProjectBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: pix-sentinel-monthly-guardrail
        BudgetLimit:
          Amount: 5
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          TagKeyValue:
            - user:project$pix-sentinel
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: ABSOLUTE_VALUE
            Threshold: 2
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  QueueUrl:
    Value: !Ref TransactionQueue
  QueueArn:
    Value: !GetAtt TransactionQueue.Arn
  BucketName:
    Value: !Ref DataBucket
  SimulationEnabled:
    Value: !Ref EnableSimulation
