name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,aws]'
      - run: ruff check src scripts tests
      - run: pytest
      - run: python scripts/benchmark_stream.py --count 10000 --output artifacts/benchmark.json
      - run: python -m compileall -q src scripts tests
